# Agent layer: adds the LLM-powered Agent, MCP, and Chatbot services
# along with the frontend-proxy patches needed to route to the chatbot.
#
# Usage (typical):
#   docker compose -f compose.yaml -f compose.full.yaml \
#                  -f compose.agent.yaml \
#                  -f compose.extras.yaml up


services:
  # Agent
  agent:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-agent
    container_name: agent
    build:
      context: ./
      dockerfile: ${AGENT_DOCKERFILE}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    ports:
      - "${AGENT_PORT}"
    volumes:
      - ./src/agent/fixtures:/app/fixtures
    environment:
      - GRAPH_RECURSION_LIMIT
      - MCP_ENDPOINT
      - MCP_PORT
      - MCP_ENABLED
      - AGENT_ENDPOINT
      - AGENT_PORT
      - LLM_BASE_URL
      - LLM_MODEL
      - LLM_TLS_VERIFY
      - API_KEY
      - USE_VCR
      - VCR_MATCH_THRESHOLD
      - OPENAI_API_KEY=${API_KEY}
      - APPLICATION_ENDPOINT
      - FLAGD_HOST
      - FLAGD_PORT
    depends_on:
      product-catalog:
        condition: service_started
      mcp:
        condition: service_started
      flagd:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # MCP
  mcp:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-mcp
    container_name: mcp
    build:
      context: ./
      dockerfile: ${MCP_DOCKERFILE}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    ports:
      - "${MCP_PORT}"
    environment:
      - MCP_ENDPOINT
      - MCP_PORT
      - APPLICATION_ENDPOINT
    depends_on:
      frontend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ChatBot
  chatbot:
    image: ${IMAGE_NAME}:${DEMO_VERSION}-chatbot
    container_name: chatbot
    build:
      context: ./
      dockerfile: ${CHATBOT_DOCKERFILE}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    ports:
      - "${CHATBOT_PORT}"
    environment:
      - AGENT_PORT
      - AGENT_ENDPOINT
      - CHATBOT_PORT
      - CHATBOT_ROOT_PATH
    depends_on:
      agent:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Patch frontend-proxy to expose chatbot host/port and depend on chatbot
  frontend-proxy:
    depends_on:
      chatbot:
        condition: service_started

  # Patch load-generator to also exercise the agent's /prompt endpoint
  load-generator:
    environment:
      - AGENT_ENDPOINT
      - AGENT_PORT
    depends_on:
      agent:
        condition: service_started
