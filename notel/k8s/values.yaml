e, country, zipCode}.", "name": "get_shipping_quote", "parameters": {"properties": {"address": {}, "currency_code": {}, "items": {}}, "required": ["items", "currency_code", "address"], "type": "object"}}, "type": "function"}, {"function": {"description": "List supported currencies in Astronomy Shop.", "name": "get_supported_currencies", "parameters": {"properties": {}, "type": "object"}}, "type": "function"}, {"function": {"description": "List all products available in the Astronomy Shop.", "name": "list_products", "parameters": {"properties": {}, "type": "object"}}, "type": "function"}]}'
